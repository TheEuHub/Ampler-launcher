name: Tests
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-save --no-package-lock jsdom@22 puppeteer-core@23
      - run: python3 -m unittest discover -s tests
      - run: node tests/security.test.cjs
      - run: node tests/verify-offline.mjs
      - run: node tests/mobile-test.mjs
        env:
          MOBILE_TEST_REQUIRED: 1
